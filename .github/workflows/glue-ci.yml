name: Glue Notebook CI/CD

on:
  push:
    branches: [Dev, main]
  pull_request:
    branches: [main]

jobs:
  validate-code:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Validate Python syntax
        run: |
          echo "🔍 Validating Python files..."
          find . -name "*.py" -type f -exec python -m py_compile {} \; 2>&1 | grep -v "^$" || echo "✅ All Python files are valid!"
      
      - name: Workflow complete
        run: |
          echo "================================================"
          echo "✅ GitHub Actions CI/CD workflow completed!"
          echo "✅ Code validated successfully"
          echo "================================================"
